<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Budget App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>My Budget</h1>

<section>
    <h2>Monthly income</h2>
    <input id="income" type="number" placeholder="Income in kr">
    <button onclick="loadSummary()">Update</button>
</section>

<section>
    <h2>Add expense</h2>
    <input id="description" placeholder="Description (e.g. Rent)">
    <input id="amount" type="number" placeholder="Amount in kr">
    <select id="category">
        <option value="">Auto category</option>
        <option>Housing</option>
        <option>Insurance</option>
        <option>Food</option>
        <option>Transport</option>
        <option>Subscriptions</option>
        <option>Leisure</option>
        <option>Other</option>
    </select>
    <input id="date" type="date">
    <label><input id="fixed" type="checkbox"> Fixed every month</label>
    <button onclick="addExpense()">Add</button>

    <p>Or upload a receipt:</p>
    <input id="receipt" type="file" accept="image/*">
    <button onclick="uploadReceipt()">Read receipt</button>
    <span id="status"></span>
</section>

<section>
    <h2>Next month</h2>
    <p>Estimated spending: <b id="estimate">0</b> kr</p>
    <ul id="advice"></ul>
    <h3>Per category</h3>
    <ul id="categories"></ul>
</section>

<section>
    <h2>Expenses</h2>
    <table>
        <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th></th></tr></thead>
        <tbody id="list"></tbody>
    </table>
</section>

<script src="script.js"></script>
</body>
</html>
