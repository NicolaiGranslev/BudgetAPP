<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Budget App</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Budget Tracker</h1>
    <div class="income">
        <label for="income">This month's income</label>
        <input id="income" type="number" placeholder="kr" onchange="loadSummary()">
    </div>
</header>

<main>
    <!-- Three key numbers -->
    <div class="stats">
        <div class="stat"><span>This month's income</span><b id="statIncome">0 kr</b></div>
        <div class="stat"><span>Estimate next month</span><b id="estimate">0 kr</b></div>
        <div class="stat"><span>Left over</span><b id="leftOver">0 kr</b></div>
    </div>

    <div class="grid">
        <section class="card">
            <h2>Add expense</h2>

            <!-- Click or drag a receipt photo here -->
            <label class="dropzone">
                <input id="receipt" type="file" accept="image/*" onchange="uploadReceipt()">
                <span class="big">📷</span>
                <b>Upload receipt</b>
                <small>Click or drag a photo here</small>
            </label>
            <p id="status" class="muted"></p>

            <input id="description" placeholder="Description, e.g. Rent">
            <input id="amount" type="number" placeholder="Amount in kr">
            <select id="category">
                <option value="">Auto category</option>
                <option>Housing</option>
                <option>Insurance</option>
                <option>Food</option>
                <option>Transport</option>
                <option>Subscriptions</option>
                <option>Fun</option>
                <option>Other</option>
            </select>
            <input id="date" type="date">
            <label class="check"><input id="fixed" type="checkbox"> Fixed every month</label>
            <button onclick="addExpense()">Add expense</button>
        </section>

        <section class="card">
            <h2>Next month</h2>
            <ul id="advice" class="advice"></ul>
            <h3>Spending per category</h3>
            <div id="categories"></div>
        </section>
    </div>

    <section class="card">
        <h2>Expenses</h2>
        <table>
            <thead><tr><th>Date</th><th>Description</th><th>Category</th><th>Amount</th><th></th></tr></thead>
            <tbody id="list"></tbody>
        </table>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
