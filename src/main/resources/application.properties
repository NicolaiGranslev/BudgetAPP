# Port: 8080 locally, the hosting service sets PORT online
server.port=${PORT:8080}

# H2 = small database saved in a file, no installation needed
spring.datasource.url=jdbc:h2:file:./data/budgetdb
spring.jpa.hibernate.ddl-auto=update

# Max receipt image size (OCR.space free tier allows 1 MB)
spring.servlet.multipart.max-file-size=1MB

# API key for OCR.space (get your own free key at ocr.space/ocrapi)
# "helloworld" is their public test key. Online it is read from the OCR_API_KEY variable.
ocr.api.key=${OCR_API_KEY:helloworld}
