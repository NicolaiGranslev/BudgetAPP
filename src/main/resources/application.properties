# Port: 8080 local
server.port=${PORT:8080}

# H2 = small database saved in a file, no installation needed
spring.datasource.url=jdbc:h2:file:./data/budgetdb
spring.jpa.hibernate.ddl-auto=update

# Max receipt image size (the browser shrinks photos to under 1 MB before upload)
spring.servlet.multipart.max-file-size=5MB

# API key for OCR.space
# "helloworld" is their public test key.
ocr.api.key=${OCR_API_KEY:helloworld}

# API key for the AI model Claude (Anthropic), used for budget advice
ai.api.key=${ANTHROPIC_API_KEY:}

